<!DOCTYPE html>
<!--
  REGADORES · Lecturas de contadores y cargas de tanque
  PWA offline first, misma arquitectura que la app de plagas:
    - index.html: toda la app (HTML + CSS + JS sin frameworks)
    - sw.js: funcionamiento sin conexión
    - manifest.json: instalable en el móvil
  Datos en el móvil: IndexedDB (base "regadores": almacenes "kv" y "registros").
  Base de datos: Campo (Supabase), esquemas nucleo y fertirrigacion. La conexión se pone en
  SUPABASE_URL y SUPABASE_KEY, al principio del script (buscar "CONEXIÓN CON SUPABASE").
  Sin esos datos arranca en modo demostración (La Mezquita con lecturas inventadas).
  Autor: Álvaro Parra Boccoli
-->

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--letra);background:var(--fondo);color:var(--tinta);font-size:17px;line-height:1.35}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--agua);outline-offset:2px}
img{max-width:100%}

.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0F5C7E;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}

.cab .volver.on{display:block}
.cab .tit{flex:1;min-width:0}

    {id_producto: "pr-smg", nombre: "Sulfato magnésio", estado: "solido", densidad_kg_l: null},
    {id_producto: "pr-edta", nombre: "EDTA ROY", estado: "solido", densidad_kg_l: null},
    {id_producto: "pr-fos", nombre: "Ac. fosfórico(50%)", estado: "liquido", densidad_kg_l: 1.33},
    {id_producto: "pr-cn9", nombre: "Soluc. nitro-cálcica neutra (CN-9)", estado: "liquido", densidad_kg_l: 1.5},
    {id_producto: "pr-n32", nombre: "Soluc. N-32%", estado: "liquido", densidad_kg_l: 1.32},
    {id_producto: "pr-na", nombre: "N. amónico(34,2%)", estado: "solido", densidad_kg_l: null}
  ];
  const productosFinca = [["pr-nk", 1, 25], ["pr-sk", 2, 25], ["pr-smg", 3, 25], ["pr-edta", 4, null], ["pr-fos", 5, null], ["pr-cn9", 6, null], ["pr-n32", 7, null], ["pr-na", 8, 25]]
    .map(([id_producto, orden, envase_kg]) => ({codigo_finca: "MEZ", id_producto, orden, envase_kg}));
  const depositos = [
    ["d1", "D1 · Nitrato potásico (+ sulfato)", 1000, "solucion_madre", "pr-nk"],
    ["d2", "D2 · Sulfato potásico", 1000, "solucion_madre", "pr-sk"],
    ["d3", "D3 · Sulfato magnesio", 1000, "solucion_madre", "pr-smg"],
    ["d4", "D4 · Microelementos", 1000, "solucion_madre", "pr-edta"],
    ["d5", "D5 · Ácido fosfórico", 1000, "producto_puro", "pr-fos"],
    ["d6", "D6 · Nitrocálcica", 3000, "producto_puro", "pr-cn9"],
    ["d7", "D7 · N-32", 3000, "producto_puro", "pr-n32"]
  ].map(([id_deposito, nombre, capacidad_l, tipo, id_producto]) => ({id_deposito, id_cabezal: cab, nombre, capacidad_l, tipo, activo: true, id_producto}));
  const m = {
    fincas: [{codigo_finca: "MEZ", nombre: "La Mezquita", provincia: "Huelva"}],
    cabezales: [{id_cabezal: cab, codigo_finca: "MEZ", nombre: "General", caudal_maximo_m3_h: 120, activo: true}],
    depositos, valvulas, vparcelas, productos, productosFinca,
    personas: [{id_persona: "p-regador", nombre: "Regador", rol: "regador", codigo_finca: "MEZ", activo: true}],
    parcelas: ["MEZ1", "MEZ2", "MEZ3", "MEZ4", "MEZ5", "MEZ6", "MEZ7", "MEZ8", "MEZ9"], poligonos: []
  };
  m.valvulas.find(v => v.id_valvula === "v-pozo").en_parada = true;

  const h = hoy();
  const dias = [];
  for(let i = 30; i >= 1; i--) dias.push(sumarDias(h, -i));
  const hijas = id => valvulas.filter(v => v.id_valvula_padre === id && v.activo);
  const consumo = {};
  valvulas.filter(v => v.activo && v.tipo === "valvula").forEach(v => {
    consumo[v.id_valvula] = dias.map((d, i) => Math.round(v.caudal_teorico_m3_h * (1.6 + 0.6 * Math.sin(i / 4) + azar() * 0.7)));
  });
  const sinRiegoV3 = sumarDias(h, -6);
  let iSinRiego = dias.indexOf(sinRiegoV3);
  if(diaSemana(sinRiegoV3) === 0) iSinRiego = dias.indexOf(sumarDias(h, -5));
  consumo["v-3"][iSinRiego] = 0;
  const suma = (ids, i) => ids.reduce((a, id) => a + (consumo[id] ? consumo[id][i] : 0), 0);
  consumo["v-g2"] = dias.map((d, i) => Math.round(suma(hijas("v-g2").map(v => v.id_valvula), i) * (1.005 + azar() * 0.015)));
  consumo["v-g1"] = dias.map((d, i) => Math.round((consumo["v-g2"][i] + suma(["v-4", "v-9"], i)) * (1.003 + azar() * 0.01)));
  consumo["v-pozo"] = dias.map((d, i) => Math.round(consumo["v-g1"][i] * (1.008 + azar() * 0.006)));

  let saltoV5 = sumarDias(h, -1);
  if(diaSemana(saltoV5) === 0) saltoV5 = sumarDias(h, -2);
  let atrasadaV7 = sumarDias(h, -4);
  if(diaSemana(atrasadaV7) === 0) atrasadaV7 = sumarDias(h, -3);

  const reg = [];
  Object.keys(consumo).forEach(idV => {
    let acumulado = Math.round(15000 + azar() * 60000);
    let ultima = null;
    dias.forEach((d, i) => {
      acumulado += consumo[idV][i];
      if(diaSemana(d) === 0) return;
      if(idV === "v-5" && d === saltoV5) return;
      if(idV === "v-pozo" && difDias(d, h) <= 12) return;
      const r = {
        id: uuid(), tipo: "lectura", id_valvula: idV, fecha: d,
        lectura_inicial_m3: ultima, lectura_final_m3: acumulado,
        volumen_teorico_m3: consumo[idV] && valvulas.find(v => v.id_valvula === idV).tipo === "valvula" ? Math.round(valvulas.find(v => v.id_valvula === idV).caudal_teorico_m3_h * 2) : null,
        id_persona: "p-regador", obs: [], observaciones: null,
        registrado: new Date(aFecha(d).getTime() + 8.5 * 3600000).toISOString(),
        avisos: [], reinicio: false, revisada_en: null, revisada_por: null,
        estado: "subido", origen: "servidor"
      };
      if(idV === "v-3" && i === iSinRiego){ r.avisos = ["sin_movimiento"]; r.obs = ["No se ha regado"]; r.observaciones = "No se ha regado"; }
      if(idV === "v-7" && d === atrasadaV7){ r.registrado = new Date(aFecha(d).getTime() + 32 * 3600000).toISOString(); }
      reg.push(r);
      ultima = acumulado;
    });
  });

  const plan = {d1: [100, 4], d2: [75, 5], d3: [50, 6], d4: [10, 9], d5: [400, 7], d6: [1500, 10], d7: [1200, 8]};
  depositos.forEach((d, k) => {
    const [cant, cada] = plan[d.id_deposito];
    const pr = productos.find(p => p.id_producto === d.id_producto);
    for(let i = 28 - k; i >= 1; i -= cada){
      let dia = sumarDias(h, -i);
      if(diaSemana(dia) === 0) dia = sumarDias(dia, -1);
      const ts = new Date(aFecha(dia).getTime() + 9 * 3600000).toISOString();
      reg.push({
        id: uuid(), tipo: "carga", id_deposito: d.id_deposito, fecha: ts, volumen_final_l: d.capacidad_l, nivel: 1,
        id_persona: "p-regador", observaciones: null, registrado: ts,
        lineas: [{id_producto: d.id_producto, cantidad: cant, unidad: pr.estado === "solido" ? "kg" : "L"}],
        estado: "subido", origen: "servidor"
      });
    }
  });
  const teoricos = {"pr-nk": 300, "pr-sk": 280, "pr-smg": 120, "pr-fos": 40, "pr-n32": 120};
  dias.forEach(d => {
    if(diaSemana(d) === 0) return;
    Object.keys(teoricos).forEach(idP => {
      const t = teoricos[idP];
      reg.push({id: uuid(), tipo: "abonado", id_cabezal: cab, id_producto: idP, fecha: d,
        gasto_real_l: Math.round(t * (0.95 + azar() * 0.15) / 10) * 10, gasto_teorico_l: t,
        preparado_cantidad: null, preparado_unidad: null, preparado_litros: null,
        id_persona: "p-regador", observaciones: null, registrado: new Date(aFecha(d).getTime() + 32.5 * 3600000).toISOString(), estado: "subido", origen: "servidor"});
    });
  });
  reg.push({id: uuid(), tipo: "entrada", fecha: sumarDias(h, -9), codigo_finca: "MEZ", id_producto: "pr-sk", cantidad: 1000, unidad: "kg", id_persona: "p-regador", observaciones: "Al almacén", registrado: new Date(aFecha(sumarDias(h, -9)).getTime() + 10 * 3600000).toISOString(), estado: "subido", origen: "servidor"});
  reg.push({id: uuid(), tipo: "valvula", fecha: sumarDias(h, -3), id_valvula: "v-4", codigo_parcela: "MEZ4", id_producto: "pr-na", cantidad: 4, unidad: "kg", metodo: "bombona", id_persona: "p-regador", observaciones: null, registrado: new Date(aFecha(sumarDias(h, -3)).getTime() + 11 * 3600000).toISOString(), estado: "subido", origen: "servidor"});
  depositos.forEach(d => {
    const ult = reg.filter(r => r.tipo === "carga" && r.id_deposito === d.id_deposito).sort((a, b) => a.fecha < b.fecha ? 1 : -1)[0];
    if(!ult) return;
    const dias = Math.min(4, difDias(diaDeTimestamp(ult.fecha), h) - 1);
    for(let k = 1; k <= dias; k++){
      const dia = sumarDias(diaDeTimestamp(ult.fecha), k);
      if(diaSemana(dia) === 0) continue;
      const ts = new Date(aFecha(dia).getTime() + 8 * 3600000).toISOString();
      reg.push({id: uuid(), tipo: "nivel", id_deposito: d.id_deposito, fecha: ts, nivel_l: Math.max(0, Math.round(d.capacidad_l * (1 - 0.18 * k) / 50) * 50), id_persona: "p-regador", observaciones: null, registrado: ts, estado: "subido", origen: "servidor"});
    }
  });
  return {m, reg};
}

  const opcional = pr => pr.catch(e => { S.tablasFaltan = (S.tablasFaltan || []).concat(e.message.split(":")[0]); return []; });

  const [abonado, entradas, aplicaciones, traspasos] = await Promise.all([

  ]);

  ]);

function convertirPoligonos(filas){
  const out = [];
  (filas || []).forEach(f => {
    try{
      let g = typeof f.geojson === "string" ? JSON.parse(f.geojson) : f.geojson;
      if(g && g.type === "Feature") g = g.geometry;
      if(g && g.type === "FeatureCollection" && g.features && g.features[0]) g = g.features[0].geometry;
      let anillos = [];
      if(g && g.type === "Polygon") anillos = [g.coordinates[0]];
      else if(g && g.type === "MultiPolygon") anillos = g.coordinates.map(p => p[0]);
      anillos.filter(a => Array.isArray(a) && a.length > 2).forEach(a => out.push({codigo_parcela: f.codigo_parcela, anillo: a.map(c => [Number(c[0]), Number(c[1])])}));
    }catch(e){}
  });
  return out;
}

async function fusionarServidor(lecturas, preparaciones, idsV, idsD, desde, niveles, ab){
  ab = ab || {abonado: [], entradas: [], aplicaciones: [], traspasos: [], idsCab: [], finca: null};
  const locales = new Map(S.reg.map(r => [r.id, r]));
  const fuera = S.reg.filter(r => r.estado === "subido" && (
    (r.tipo === "lectura" && idsV.includes(r.id_valvula) && r.fecha >= desde) ||
    ((r.tipo === "carga" || r.tipo === "nivel") && idsD.includes(r.id_deposito) && diaDeTimestamp(r.fecha) >= desde) ||
    (r.tipo === "abonado" && ab.idsCab.includes(r.id_cabezal) && r.fecha >= desde) ||
    ((r.tipo === "entrada" || r.tipo === "traspaso") && r.codigo_finca === ab.finca && r.fecha >= desde) ||
    (r.tipo === "valvula" && idsV.includes(r.id_valvula) && r.fecha >= desde)));
  for(const r of fuera){ await regDel(r.id); }
  const quitar = new Set(fuera.map(r => r.id));
  let nuevos = [];
  lecturas.forEach(l => {
    const loc = locales.get(l.id_lectura);
    if(loc && loc.estado !== "subido") return;
    const obs = (l.observaciones || "").split(";").map(s => s.trim()).filter(Boolean);
    nuevos.push({
      id: l.id_lectura, tipo: "lectura", id_valvula: l.id_valvula, fecha: l.fecha,
      lectura_inicial_m3: l.lectura_inicial_m3 == null ? null : Number(l.lectura_inicial_m3),
      lectura_final_m3: l.lectura_final_m3 == null ? null : Number(l.lectura_final_m3),
      volumen_teorico_m3: l.volumen_teorico_m3 == null ? null : Number(l.volumen_teorico_m3),
      id_persona: l.id_persona, obs, observaciones: l.observaciones, registrado: l.registrado || l.creado,
      avisos: l.avisos || [], reinicio: !!l.reinicio, sin_riego: !!l.sin_riego, revisada_en: l.revisada_en || null, revisada_por: l.revisada_por || null,
      estado: "subido", origen: loc ? loc.origen : "servidor"
    });
  });
  preparaciones.forEach(p => {
    const loc = locales.get(p.id_preparacion);
    if(loc && loc.estado !== "subido") return;
    const dep = S.m.depositos.find(d => d.id_deposito === p.id_deposito);
    nuevos.push({
      id: p.id_preparacion, tipo: "carga", id_deposito: p.id_deposito, fecha: p.fecha, volumen_final_l: Number(p.volumen_final_l),
      nivel: dep ? Number(p.volumen_final_l) / Number(dep.capacidad_l) : null,
      id_persona: p.id_persona, observaciones: p.observaciones, registrado: p.registrado || p.creado,
      lineas: (p.preparaciones_lineas || []).map(x => ({id_producto: x.id_producto, cantidad: Number(x.cantidad), unidad: x.unidad})),
      estado: "subido", origen: loc ? loc.origen : "servidor"
    });
  });
  const num = v => v == null ? null : Number(v);
  const yaLocal = id => { const loc = locales.get(id); return loc && loc.estado !== "subido"; };
  const localAb = new Set(S.reg.filter(r => r.tipo === "abonado" && r.estado !== "subido").map(r => r.id_cabezal + "|" + r.id_producto + "|" + r.fecha));
  ab.abonado.forEach(a => {
    if(localAb.has(a.id_cabezal + "|" + a.id_producto + "|" + a.fecha)) return;
    nuevos.push({id: a.id_abonado, tipo: "abonado", id_cabezal: a.id_cabezal, id_producto: a.id_producto, fecha: a.fecha,
      gasto_real_l: num(a.gasto_real_l), gasto_teorico_l: num(a.gasto_teorico_l), preparado_cantidad: num(a.preparado_cantidad), preparado_unidad: a.preparado_unidad, preparado_litros: num(a.preparado_litros), lleno: a.lleno, mezcla: a.mezcla || null,
      id_persona: a.id_persona, observaciones: a.observaciones, registrado: a.registrado, estado: "subido", origen: "servidor"});
  });
  ab.entradas.forEach(c => { if(yaLocal(c.id_compra)) return; nuevos.push({id: c.id_compra, tipo: "entrada", fecha: c.fecha, codigo_finca: c.codigo_finca, id_producto: c.id_producto, cantidad: num(c.cantidad), unidad: c.unidad, id_persona: c.id_persona, observaciones: c.observaciones, registrado: c.registrado, estado: "subido", origen: "servidor"}); });
  ab.aplicaciones.forEach(c => { if(yaLocal(c.id_complemento)) return; nuevos.push({id: c.id_complemento, tipo: "valvula", fecha: c.fecha, id_valvula: c.id_valvula, codigo_parcela: c.codigo_parcela, id_producto: c.id_producto, cantidad: num(c.cantidad), unidad: c.unidad, metodo: c.metodo, id_persona: c.id_persona, observaciones: c.observaciones, registrado: c.registrado, estado: "subido", origen: "servidor"}); });
  ab.traspasos.forEach(t => { if(yaLocal(t.id_traspaso)) return; nuevos.push({id: t.id_traspaso, tipo: "traspaso", fecha: t.fecha, codigo_finca: t.codigo_finca, codigo_finca_destino: t.codigo_finca_destino, destino: t.destino, id_producto: t.id_producto, cantidad: num(t.cantidad), unidad: t.unidad, id_persona: t.id_persona, observaciones: t.observaciones, registrado: t.registrado, estado: "subido", origen: "servidor"}); });
  (niveles || []).forEach(n => {
    const loc = locales.get(n.id_nivel);
    if(loc && loc.estado !== "subido") return;
    nuevos.push({id: n.id_nivel, tipo: "nivel", id_deposito: n.id_deposito, fecha: n.fecha, nivel_l: Number(n.nivel_l), id_persona: n.id_persona, observaciones: n.observaciones, registrado: n.creado, estado: "subido", origen: loc ? loc.origen : "servidor"});
  });
  await regPutVarios(nuevos);
  const ids = new Set(nuevos.map(n => n.id));
  S.reg = S.reg.filter(r => !quitar.has(r.id) && !ids.has(r.id)).concat(nuevos);
}

async function purgarAntiguos(){
  const limite = sumarDias(hoy(), -DIAS_CONSERVAR);
  const viejos = S.reg.filter(r => r.estado === "subido" && (String(r.fecha).length > 10 ? diaDeTimestamp(r.fecha) : r.fecha) < limite);
  for(const r of viejos) await regDel(r.id);
  const ids = new Set(viejos.map(r => r.id));
  S.reg = S.reg.filter(r => !ids.has(r.id));
}

function filaLectura(r){

let subiendo = false;
async function subir(silencioso, motivo){
  if(subiendo) return;
  const lista = pendientes();
  if(!lista.length){ if(!silencioso) toast("No hay nada pendiente de enviar"); return; }
  if(S.modo !== "campo"){ if(!silencioso) toast("Falta la conexión con Campo en el código"); return; }
  if(!navigator.onLine){
    if(!silencioso) await hoja({titulo: "Sin cobertura", msg: "Todo está guardado en el móvil (" + esc(resumenRegistros(lista)) + "). Envíalo cuando tengas red.", opciones: [{t: "Entendido", v: null, c: "gris"}]});
    return;
  }
  subiendo = true; pintarPie();
  const enviados = [], fallidos = [];
  let sinRed = false;
  for(const r of lista){
    try{
      if(r.tipo === "lectura"){
        await sbUpsert("fertirrigacion", "lecturas_contador", [filaLectura(r)], "id_lectura");
      } else if(r.tipo === "abonado"){
        await sbUpsert("fertirrigacion", "abonado_diario", [filaAbonado(r)], "id_cabezal,id_producto,fecha");
      } else if(r.tipo === "entrada"){
        await sbUpsert("fertirrigacion", "compras", [filaEntrada(r)], "id_compra");
      } else if(r.tipo === "valvula"){
        await sbUpsert("fertirrigacion", "complementos", [filaValvula(r)], "id_complemento");
      } else if(r.tipo === "traspaso"){
        await sbUpsert("fertirrigacion", "traspasos", [filaTraspaso(r)], "id_traspaso");
      } else if(r.tipo === "recuento"){
        await sbUpsert("fertirrigacion", "recuentos", [{id_recuento: r.id, fecha: r.fecha, codigo_finca: r.codigo_finca, id_producto: r.id_producto, cantidad: r.cantidad, unidad: r.unidad, id_persona: personaReal(r.id_persona), observaciones: r.observaciones, registrado: r.registrado}], "id_recuento");
      } else if(r.tipo === "nivel"){
        await sbUpsert("fertirrigacion", "niveles_deposito", [{id_nivel: r.id, id_deposito: r.id_deposito, fecha: r.fecha, nivel_l: r.nivel_l, id_persona: personaReal(r.id_persona), observaciones: r.observaciones}], "id_nivel");
      } else {
        await sbUpsert("fertirrigacion", "preparaciones", [filaCarga(r)], "id_preparacion");
        await sbDelete("fertirrigacion", "preparaciones_lineas", "id_preparacion=eq." + r.id);
        await sbInsert("fertirrigacion", "preparaciones_lineas", r.lineas.map(l => ({id_preparacion: r.id, id_producto: l.id_producto, cantidad: l.cantidad, unidad: l.unidad})));
      }
      r.estado = "subido"; r.subido_en = new Date().toISOString(); r.error = null; enviados.push(r);
    }catch(e){
      if(e.sinRed){ sinRed = true; }
      else if(e.status === 409 && r.tipo === "lectura"){ r.estado = "conflicto"; r.error = "Ya hay otra lectura de este contador ese día, apuntada desde otro móvil"; fallidos.push(r); }
      else { r.error = e.message; fallidos.push(r); }
    }
    await regPut(r);
    if(sinRed) break;
  }
  subiendo = false;
  if(enviados.length){
    S.ultimoEnvio = {cuando: new Date().toISOString(), resumen: resumenRegistros(enviados), n: enviados.length};
    await kvSet("ultimoEnvio", S.ultimoEnvio);
  }
  pintarPie();
  if(["inicio", "lista", "gasto", "abonado"].includes(S.vista)) pintar();
  if(S.vista === "admin") pintarAdmin();
  const quedan = pendientes();
  let msg = enviados.length ? "<p style='margin:0 0 8px'><b>Enviado " + esc(etiquetaDia(hoy())) + " a las " + horaCorta(S.ultimoEnvio.cuando) + ":</b> " + esc(resumenRegistros(enviados)) + ".</p>" : "";
  if(sinRed) msg += "<p style='margin:0 0 8px'>Se ha cortado la conexión. Queda guardado en el móvil sin enviar: " + esc(resumenRegistros(quedan)) + ".</p>";
  if(fallidos.length) msg += "<p style='margin:0 0 8px;color:var(--rojo)'>" + fallidos.length + " con problema: el técnico lo verá en Administración, Revisión.</p>";
  await hoja({titulo: enviados.length && !sinRed && !fallidos.length ? "Enviado" : "Envío incompleto", msg, opciones: [{t: "Entendido", v: null, c: "ok"}]});
  if(enviados.length && navigator.onLine && typeof refrescarFinca === "function"){ ultimoRefresco = 0; refrescarFinca(); }
}

  const t = $("#toast"); t.textContent = msg; t.classList.add("on");

function hoja(opc){
  return new Promise(resolve => {
    const velo = document.createElement("div");
    velo.className = "velo";
    velo.innerHTML = '<div class="hoja" role="dialog" aria-modal="true">' +
      (opc.titulo ? "<h3>" + esc(opc.titulo) + "</h3>" : "") +
      (opc.msg ? '<div class="msg">' + opc.msg + "</div>" : "") +
      (opc.html || "") +
      (opc.opciones || []).map((o, i) => '<button class="opc ' + (o.c || "") + '" data-i="' + i + '">' + esc(o.t) + "</button>").join("") +
      "</div>";
    const cerrar = v => { velo.remove(); resolve(v); };
    velo.addEventListener("click", e => {
      if(e.target === velo) return cerrar(null);
      const b = e.target.closest("button[data-i]");
      if(b){ const o = opc.opciones[Number(b.dataset.i)]; cerrar(opc.alAceptar ? opc.alAceptar(o.v, velo) : o.v); }
    });
    document.body.appendChild(velo);
    const inp = velo.querySelector("input");
    if(inp) setTimeout(() => inp.focus(), 60);
  });
}

function distanciaM(a, b, c, d){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(c - a), dLon = r(d - b);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function iniciarGPS(){
  if(S.gpsWatch != null || !("geolocation" in navigator)) return;
  try{

      () => {}, {enableHighAccuracy: true, maximumAge: 10000, timeout: 20000});
  }catch(e){}
}

  if(!S.gps) return null;
  const d = valvulasALeer().filter(v => v.latitud != null).map(v => ({v, m: distanciaM(S.gps.lat, S.gps.lon, Number(v.latitud), Number(v.longitud))})).sort((a, b) => a.m - b.m);
  if(!d.length || d[0].m > 40) return null;
  if(d[1] && d[1].m < d[0].m * 1.8) return null;
  return d[0];
}

function cuentakm(texto, opc){
  opc = opc || {};
  const t = texto || "";
  const [ent, dec] = t.split(",");
  const entero = (ent || "").replace(/^0+(?=\d)/, "");
  const celdas = Math.max(opc.min || 6, entero.length);
  let html = '<div class="cuentakm' + (opc.chico ? " chico" : "") + (opc.inactivo ? " inactivo" : "") + '" aria-label="' + esc(t || "0") + ' metros cúbicos">';
  for(let i = 0; i < celdas; i++){
    const pos = i - (celdas - entero.length);
    html += pos >= 0 ? '<span class="r">' + entero[pos] + "</span>" : '<span class="r vacia">0</span>';
  }
  if(dec !== undefined){
    html += '<span class="coma">,</span>';
    const nd = Math.max(1, dec.length);
    for(let i = 0; i < nd; i++) html += dec[i] !== undefined ? '<span class="r dec">' + dec[i] + "</span>" : '<span class="r dec vacia" style="opacity:.5">0</span>';
  }
  if(opc.cursor) html += '<span class="cursor"></span>';
  return html + "</div>";
}
function textoNumero(n){

function tecladoHTML(fn){

}
function aplicarTecla(t, k, max){
  if(k === "⌫") return t.slice(0, -1);
  if(k === ","){ return t.includes(",") ? t : (t || "0") + ","; }
  const [e, d] = t.split(",");
  if(d !== undefined) return d.length < 2 ? t + k : t;
  return (e || "").replace(/^0+/, "").length < (max || 9) ? (t === "0" ? "" : t) + k : t;
}

function mensajeAviso(a, ev){

  switch(a){
    case "menor_que_anterior": return {c: "rojo", t: "Es menos que la lectura anterior (" + prevTxt + "). ¿La has leído bien?"};
    case "mayor_que_posterior": return {c: "rojo", t: "Es más que la lectura de " + etiquetaDiaLarga(ev.next.fecha) + " (" + fmtAuto(ev.next.lectura_final_m3) + " m³)."};
    case "exceso": return {c: "ambar", t: "Es mucho más de lo normal" + (ev.media ? ": suele gastar unos " + fmt(ev.media) + " m³ por día de riego." : ".")};
    case "sin_movimiento": return {c: "ambar", t: "El contador no se ha movido. Si no se regó, usa «Ese día no regó este contador»."};
    case "movimiento_en_parada": return {c: "ambar", t: "Está en parada y el contador se ha movido (" + fmt(ev.m3) + " m³). ¿Se está regando o hay una fuga?"};
  }
  return {c: "ambar", t: AVISOS_TXT[a] || a};
}

function pintarBarras(v, fecha, valor, ev, teo){

  const hoyCol = (valor != null && ev.m3 != null && ev.m3 >= 0) ? {d: fecha, m3: ev.m3, riego: ev.riego || 1, actual: true, bien: !ev.avisos.length, teo: teo != null ? teo * (ev.riego || 1) : null} : null;
  const cols = hoyCol ? ts.concat(hoyCol) : ts;

    "</div>" + (cols.some(c => c.riego > 1) ? '<div class="t" style="margin:6px 0 0">* lectura que junta varios días de riego</div>' : "") + "</div>";
}

async function guardarLectura(){
  const ed = S.ed, v = valvula(ed.idV);
  const valor = valorEd(), teo = teoEd();
  if(valor == null && !ed.noLegible){ toast("Escribe la lectura o marca «No puedo leerlo»"); return; }
  let avisos = [], reinicio = ed.reinicio, inicial = ed.inicial;
  if(valor != null && !reinicio){
    const ev = evaluar(v, ed.fecha, valor);
    if(ev.avisos.includes("menor_que_anterior")){
      const r = await hoja({
        titulo: "¿Seguro?",
        msg: esc(mensajeAviso("menor_que_anterior", ev).t),
        opciones: [{t: "Corregir", v: "corregir", c: "gris"}, {t: "La anterior estaba mal", v: "anterior"}, {t: "Han cambiado el contador o ha dado la vuelta", v: "reinicio"}]
      });
      if(!r || r === "corregir") return;
      if(r === "reinicio"){
        const ok = await hoja({titulo: "¿Contador nuevo?", msg: "Solo si han puesto un contador nuevo o el número ha vuelto a empezar. Se avisará al técnico.", opciones: [{t: "Sí, es un contador nuevo", v: "si", c: "ok"}, {t: "No, volver", v: null, c: "gris"}]});

        if(arr == null) return;
        if(arr > valor){ await hoja({titulo: "No cuadra", msg: "El número de arranque (" + fmtAuto(arr) + ") es mayor que la lectura.", opciones: [{t: "Volver", v: null, c: "gris"}]}); return; }
        reinicio = true; inicial = arr;
      } else {
        avisos.push("menor_que_anterior", "anterior_erronea");
      }
      avisos.push(...ev.avisos.filter(a => a === "mayor_que_posterior"));
    } else if(ev.avisos.length){
      const r = await hoja({titulo: "¿Seguro?", msg: ev.avisos.map(a => "<p style='margin:0 0 8px'>" + esc(mensajeAviso(a, ev).t) + "</p>").join(""), opciones: [{t: "Sí, está bien", v: "ok", c: "ok"}, {t: "Corregir", v: null, c: "gris"}]});
      if(r !== "ok") return;
      avisos.push(...ev.avisos);
    }
  }
  const ex = lecturaDelDia(ed.idV, ed.fecha);
  const prev = anterior(ed.idV, ed.fecha);
  const obs = ed.obs.concat(ed.noLegible ? ["No puedo leerlo"] : []);
  const rec = Object.assign({}, ex || {}, {
    id: ex ? ex.id : uuid(), tipo: "lectura", id_valvula: ed.idV, fecha: ed.fecha,
    lectura_inicial_m3: reinicio ? inicial : (prev ? prev.lectura_final_m3 : null),
    lectura_final_m3: ed.noLegible ? null : valor, volumen_teorico_m3: teo, id_persona: S.personaId,
    obs, observaciones: obs.length ? obs.join("; ") : null,
    registrado: ex && ex.registrado ? ex.registrado : new Date().toISOString(),
    avisos: [...new Set(avisos)], reinicio: !!reinicio, sin_riego: false,
    revisada_en: null, revisada_por: null,
    estado: "pendiente", origen: ex ? ex.origen : "movil", error: null
  });
  await regPut(rec);
  S.reg = S.reg.filter(r => r.id !== rec.id).concat(rec);
  toast(rec.avisos.length || rec.reinicio ? "Guardada en el móvil (con aviso para el técnico)" : "Guardada en el móvil");

async function guardarGasto(){
  const e = S.edG;

  filasGasto().forEach(fl => {
    const f = e.filas[fl.clave]; if(!f) return;
    const r = numTexto(f.real), t = numTexto(f.teo);
    const mezcla = fl.productos.length > 1 ? fl.clave : null;
    let cambia = false;
    fl.productos.forEach(p => {
      const ex = abonadoDe(p.id_producto, e.fecha);
      const antesR = ex && ex.gasto_real_l != null ? Number(ex.gasto_real_l) : null, antesT = ex && ex.gasto_teorico_l != null ? Number(ex.gasto_teorico_l) : null;
      if(r === antesR && t === antesT) return;
      if(r == null && !ex) return;
      cambia = true;
      cambios.push({p, r, t, ex, mezcla});
    });
    if(cambia && r != null && t != null && t > 0 && Math.abs(r - t) / t > 0.25) avisos.push(fl.productos.map(p => p.nombre).join(" + ") + ": " + fmt(r) + " L frente a " + fmt(t) + " L de teórico.");
  });

    preparado_cantidad: null, preparado_unidad: null, preparado_litros: null, observaciones: null, registrado: ahora, origen: "movil"
  }, {gasto_real_l: r, gasto_teorico_l: t, mezcla: mezcla || (ex ? ex.mezcla : null) || null, id_persona: S.personaId, estado: "pendiente", error: null}));
  await regPutVarios(recs);
  const ids = new Set(recs.map(r => r.id));
  S.reg = S.reg.filter(r => !ids.has(r.id)).concat(recs);

  S.edG = null; volver();

function cambiosCfg(){ const c = S.cfgProd; if(!c || c.finca !== S.fincaCod) return 0; return c.altas.length + c.bajas.length + Object.keys(c.envases).filter(id => !c.altas.includes(id) && !c.bajas.includes(id)).length; }

function cfgQuitar(id){
  const c = cfgProd();
  if(c.altas.includes(id)){ c.altas = c.altas.filter(x => x !== id); delete c.envases[id]; }
  else if(c.bajas.includes(id)) c.bajas = c.bajas.filter(x => x !== id);
  else c.bajas.push(id);
  pintarAdmin();
}
function cfgEnvase(id, v){
  const t = String(v).trim();
  const n = t === "" ? null : Number(t.replace(",", "."));
  if(t !== "" && (isNaN(n) || n <= 0)){ toast("Revisa el peso del saco"); pintarAdmin(); return; }
  const c = cfgProd(), pf = S.m.productosFinca.find(p => p.codigo_finca === S.fincaCod && p.id_producto === id);
  const antes = pf && pf.envase_kg != null ? Number(pf.envase_kg) : null;
  if(!c.altas.includes(id) && n === antes) delete c.envases[id]; else c.envases[id] = n;
  pintarAdmin();
}
function descartarCfg(){ S.cfgProd = null; pintarAdmin(); }
async function guardarCfgProductos(){
  const c = cfgProd(), n = cambiosCfg();
  if(!n) return true;
  if(S.modo !== "campo"){ toast("Falta la conexión con Campo en el código"); return false; }
  if(!navigator.onLine){ await hoja({titulo: "Sin cobertura", msg: "Los cambios siguen en la lista, marcados como sin subir. Súbelos cuando tengas red.", opciones: [{t: "Entendido", v: null, c: "gris"}]}); return false; }
  const f = S.fincaCod;
  let orden = Math.max(0, ...S.m.productosFinca.filter(p => p.codigo_finca === f).map(p => Number(p.orden) || 0));
  try{
    for(const id of c.altas){ orden++; await sbInsert("fertirrigacion", "productos_finca", [{codigo_finca: f, id_producto: id, orden}]); }
    for(const id of c.bajas) await sbDelete("fertirrigacion", "productos_finca", "codigo_finca=eq." + enc(f) + "&id_producto=eq." + id);
  }catch(e){
    await hoja({titulo: "No se pudo subir todo", msg: esc(e.message) + "<br>Vuelve a descargar los datos de la finca para ver lo que quedó en Campo.", opciones: [{t: "Entendido", v: null, c: "gris"}]});
    return false;
  }
  const pfs = await sbGet("fertirrigacion", "productos_finca?codigo_finca=eq." + enc(f) + "&order=orden").catch(() => null);
  if(pfs) S.m.productosFinca = S.m.productosFinca.filter(p => p.codigo_finca !== f).concat(pfs);
  S.cfgProd = null;
  await guardarMaestros();
  await hoja({titulo: "Cambios subidos", msg: "Subidos a Campo a las " + horaCorta(new Date().toISOString()) + ": " + n + (n === 1 ? " cambio" : " cambios") + " en los productos habituales.", opciones: [{t: "Entendido", v: null, c: "ok"}]});
  pintarAdmin();
  return true;
}

      '<button class="btn claro" onclick="cfgQuitar(\'' + f.id + '\')">' + (quitar || f.nuevo ? "Deshacer" : "Quitar") + "</button></div>";
  });
  const enLista = filas.map(f => f.id);

  h += '<div class="fila-campos" style="align-items:end;margin-top:8px"><label class="campo">Añadir producto habitual<select id="np_prod"><option value="">Elige un producto</option>' + libres.map(p => '<option value="' + p.id_producto + '">' + esc(p.nombre) + "</option>").join("") + '</select></label><div class="botonera" style="align-items:end"><button class="btn claro" onclick="cfgAlta()">Añadir a la lista</button></div></div>';

  h += "<p>Los cambios no se guardan en Campo hasta pulsar «Guardar y subir cambios». Hace falta cobertura. Los tanques y hasta cuántos litros se llenan se configuran en el dashboard.</p></div>";

function numCampo(id, opc){
  const t = ($("#" + id).value || "").trim();
  if(t === "") return opc && opc.vacio !== undefined ? opc.vacio : null;
  const n = Number(t.replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? NaN : n;
}
async function guardarConfig(tabla, filtro, cambios, aplicar, silencioso){
  if(S.modo === "campo"){
    if(!navigator.onLine){ toast("Necesitas conexión para cambiar la configuración"); return false; }
    try{ await sbPatch("fertirrigacion", tabla, filtro, cambios); }
    catch(e){ await hoja({titulo: "No se pudo guardar", msg: esc(e.message), opciones: [{t: "Entendido", v: null, c: "gris"}]}); return false; }
  }
  aplicar();
  if(!silencioso){ await guardarMaestros(); toast("Cambios guardados"); pintarAdmin(); }
  return true;
}

async function guardarValvula(id){
  const v = valvula(id);
  const estado = $("#va_" + id).value;
  const cambios = {
    nombre: $("#vn_" + id).value.trim() || v.nombre,
    orden: numCampo("vo_" + id, {vacio: 0}),
    caudal_teorico_m3_h: numCampo("vc_" + id),
    activo: estado !== "baja",
    en_parada: estado === "parada",
    id_valvula_padre: $("#vp_" + id).value || null
  };
  if(isNaN(cambios.orden) || !Number.isInteger(cambios.orden)){ toast("El orden tiene que ser un número entero"); return; }
  if(isNaN(cambios.caudal_teorico_m3_h) || (cambios.caudal_teorico_m3_h != null && cambios.caudal_teorico_m3_h < 0)){ toast("Revisa el caudal"); return; }
  let parcelas = null;
  if($("#vpn_" + id)){
    parcelas = [];
    const n = Number($("#vpn_" + id).value);
    for(let k = 0; k < n; k++){
      const c = $("#vpp_" + id + "_" + k).value; if(!c) continue;
      const f = numCampo("vpf_" + id + "_" + k, {vacio: 1});
      if(isNaN(f) || f <= 0 || f > 1){ toast("La fracción va de 0 a 1 (1 si riega la parcela entera)"); return; }
      if(parcelas.some(p => p.codigo_parcela === c)){ toast("La parcela " + c + " está repetida"); return; }
      parcelas.push({id_valvula: id, codigo_parcela: c, fraccion: f});
    }
  }
  const okV = await guardarConfig("valvulas", "id_valvula=eq." + id, cambios, () => Object.assign(v, cambios), true);
  if(!okV) return;
  if(parcelas){
    const antes = S.m.vparcelas.filter(x => x.id_valvula === id).map(x => x.codigo_parcela + ":" + Number(x.fraccion)).sort().join("|");
    const despues = parcelas.map(x => x.codigo_parcela + ":" + x.fraccion).sort().join("|");
    if(antes !== despues){
      if(S.modo === "campo"){
        try{
          await sbDelete("fertirrigacion", "valvulas_parcelas", "id_valvula=eq." + id);
          if(parcelas.length) await sbInsert("fertirrigacion", "valvulas_parcelas", parcelas);
        }catch(e){ await hoja({titulo: "No se pudieron guardar las parcelas", msg: esc(e.message), opciones: [{t: "Entendido", v: null, c: "gris"}]}); return; }
      }
      S.m.vparcelas = S.m.vparcelas.filter(x => x.id_valvula !== id).concat(parcelas);
    }
  }
  await guardarMaestros(); toast("Cambios guardados"); pintarAdmin();
}

function codigoNuevo(nombre){
  const base = ((S.fincaCod || "X") + "-" + nombre).toUpperCase().replace(/\s+/g, "_");
  let c = base, n = 2;
  while(S.m.valvulas.some(v => v.codigo_contador === c)) c = base + "_" + n++;
  return c;
}

async function guardarEnvases(){
  const pfs = S.m.productosFinca.filter(p => p.codigo_finca === S.fincaCod);
  const cambios = [];
  for(const pf of pfs){
    const el = $("#pe_" + pf.id_producto); if(!el) continue;
    const n = numCampo("pe_" + pf.id_producto);
    if(isNaN(n) || (n != null && n <= 0)){ toast("Revisa los pesos de saco"); return; }
    if(n !== (pf.envase_kg == null ? null : Number(pf.envase_kg))) cambios.push([pf, n]);
  }
  if(!cambios.length){ toast("No hay cambios"); return; }
  if(S.modo === "campo"){
    if(!navigator.onLine){ toast("Necesitas conexión para cambiar la configuración"); return; }
    try{ for(const [pf, n] of cambios) await sbPatch("fertirrigacion", "productos_finca", "codigo_finca=eq." + enc(pf.codigo_finca) + "&id_producto=eq." + pf.id_producto, {envase_kg: n}); }
    catch(e){ await hoja({titulo: "No se pudo guardar", msg: esc(e.message), opciones: [{t: "Entendido", v: null, c: "gris"}]}); return; }
  }
  cambios.forEach(([pf, n]) => { pf.envase_kg = n; });
  await guardarMaestros(); toast("Cambios guardados"); pintarAdmin();
}

  valvulasActivas().forEach(v => {

const TESELA_URL = (z, x, y) => "https://www.ign.es/wmts/pnoa-ma?request=GetTile&service=WMTS&version=1.0.0&Format=image/jpeg&layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&TileMatrix=" + z + "&TileRow=" + y + "&TileCol=" + x;
let DBT = null;
function idbTeselas(){
  if(DBT) return Promise.resolve(DBT);
  return new Promise((res, rej) => {
    const r = indexedDB.open("regadores-teselas", 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("t")) r.result.createObjectStore("t"); };
    r.onsuccess = () => { DBT = r.result; res(DBT); };
    r.onerror = () => rej(r.error);
  });
}
async function txT(modo, fn){
  const db = await idbTeselas();
  return new Promise((res, rej) => {
    const t = db.transaction("t", modo); const req = fn(t.objectStore("t"));
    t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const teselaGet = k => txT("readonly", st => st.get(k));
const teselaPut = (k, b) => txT("readwrite", st => st.put(b, k));
const teselasContar = () => txT("readonly", st => st.count());
const teselasVaciar = () => txT("readwrite", st => st.clear());

function capaTeselas(){
  const capa = L.tileLayer(TESELA_URL("{z}", "{x}", "{y}"), {maxZoom: 19, attribution: "IGN España, PNOA"});
  capa.createTile = function(c, hecho){
    const img = document.createElement("img"); img.alt = ""; img.setAttribute("role", "presentation");
    const red = () => { img.onload = () => hecho(null, img); img.onerror = e => hecho(e, img); img.src = TESELA_URL(c.z, c.x, c.y); };
    teselaGet(c.z + "_" + c.x + "_" + c.y).then(b => {
      if(b){ img.onload = () => hecho(null, img); img.onerror = red; img.src = URL.createObjectURL(b); } else red();
    }).catch(red);
    return img;
  };
  return capa;
}
function lonLatATesela(lon, lat, z){
  const n = Math.pow(2, z), r = lat * Math.PI / 180;
  return {x: Math.floor((lon + 180) / 360 * n), y: Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)};
}
function teselasNecesarias(zMin, zMax){
  const pts = [];
  S.m.poligonos.forEach(p => p.anillo.forEach(c => pts.push(c)));
  valvulasActivas().filter(v => v.latitud != null).forEach(v => pts.push([Number(v.longitud), Number(v.latitud)]));
  if(!pts.length) return [];
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
  const m = 0.002;
  const oeste = Math.min(...lons) - m, este = Math.max(...lons) + m, sur = Math.min(...lats) - m, norte = Math.max(...lats) + m;
  const lista = [];
  for(let z = zMin; z <= zMax; z++){
    const a = lonLatATesela(oeste, norte, z), b = lonLatATesela(este, sur, z);
    for(let x = a.x; x <= b.x; x++) for(let y = a.y; y <= b.y; y++) lista.push({z, x, y});
  }
  return lista;
}
async function guardarMapaSinRed(){
  const lista = teselasNecesarias(13, 18);
  if(!lista.length){ toast("Primero descarga los datos de la finca (polígonos o contadores situados)"); return; }
  if(!navigator.onLine){ toast("Necesitas conexión"); return; }
  const ok = await hoja({titulo: "Guardar el mapa sin conexión", msg: "Se descargan " + lista.length + " imágenes de satélite (unos " + fmt(lista.length * 35 / 1024, 1) + " MB). Mejor con wifi.", opciones: [{t: "Descargar", v: "ok", c: "ok"}, {t: "Volver", v: null, c: "gris"}]});
  if(ok !== "ok") return;
  let hechas = 0, fallos = 0, i = 0;
  const trabajador = async () => {
    while(i < lista.length){
      const t = lista[i++]; const k = t.z + "_" + t.x + "_" + t.y;
      try{
        if(!(await teselaGet(k))){
          const r = await fetch(TESELA_URL(t.z, t.x, t.y));
          if(!r.ok) throw new Error(r.status);
          await teselaPut(k, await r.blob());
        }
        hechas++;
      }catch(e){ fallos++; }
      if((hechas + fallos) % 20 === 0) toast("Mapa: " + (hechas + fallos) + " de " + lista.length);
    }
  };
  await Promise.all([trabajador(), trabajador(), trabajador(), trabajador()]);
  toast(fallos ? "Mapa guardado con " + fallos + " imágenes que no bajaron" : "Mapa guardado para usar sin conexión");

function diferencias(a, b){
  const out = [];
  Object.keys(b.t).forEach(id => {
    const x = a.t[id], y = b.t[id];
    if(!x) out.push("Nuevo tanque " + y.nombre + " de " + fmt(y.cap) + " L");
    else {
      if(x.prod !== y.prod) out.push("El tanque " + y.nombre + " ahora lleva " + y.prod + (x.prod === "Sin producto" ? "" : " (antes " + x.prod + ")"));
      if(x.cap !== y.cap) out.push("El tanque " + y.nombre + " es ahora de " + fmt(y.cap) + " L");
      if(x.activo !== y.activo) out.push("El tanque " + y.nombre + (y.activo ? " vuelve a estar en uso" : " se ha dado de baja"));
    }
  });
  Object.keys(b.c).forEach(id => {
    const x = a.c[id], y = b.c[id];
    if(!x) out.push("Nuevo contador: " + y.nombre);
    else {
      if(x.parada !== y.parada) out.push(y.nombre + (y.parada ? " pasa a parada" : " vuelve a leerse cada día"));
      if(x.activo !== y.activo) out.push(y.nombre + (y.activo ? " vuelve a estar en uso" : " se ha dado de baja"));
    }
  });
  const nuevosHab = b.hab.filter(n => !a.hab.includes(n));
  if(nuevosHab.length) out.push("Productos nuevos en la finca: " + nuevosHab.join(", "));
  return out;
}

        const nuevo = reg.installing; if(!nuevo) return;
        nuevo.addEventListener("statechange", () => {
          if(nuevo.state === "installed" && navigator.serviceWorker.controller) toast("Hay una versión nueva: se usará al volver a abrir la app");
          if(nuevo.state === "activated" && !navigator.serviceWorker.controller) toast("App lista para trabajar sin conexión");
        });
      });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
  });
}
arrancar();
</script>
</body>
</html>
