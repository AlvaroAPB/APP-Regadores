<!DOCTYPE html>
<!--
  REGADORES · Lecturas de contadores y cargas de tanque
  PWA offline first, misma arquitectura que la app de plagas:
    - index.html: toda la app (HTML + CSS + JS sin frameworks)
    - sw.js: funcionamiento sin conexión
    - manifest.json: instalable en el móvil
  Datos en el móvil: IndexedDB (base "regadores": almacenes "kv" y "registros").
  Base de datos: Campo (Supabase), esquemas nucleo y fertirrigacion. La conexión se pone en
  SUPABASE_URL y SUPABASE_KEY, al principio del script (buscar "CONEXIÓN CON SUPABASE").
  Sin esos datos arranca en modo demostración (La Mezquita con lecturas inventadas).
  Autor: Álvaro Parra Boccoli
-->

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--letra);background:var(--fondo);color:var(--tinta);font-size:17px;line-height:1.35}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--agua);outline-offset:2px}
img{max-width:100%}

.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0F5C7E;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}

.cab .volver.on{display:block}
.cab .tit{flex:1;min-width:0}

function idb(){
  if(DB) return Promise.resolve(DB);
  return new Promise((res, rej) => {
    const r = indexedDB.open("regadores", 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if(!db.objectStoreNames.contains("registros")) db.createObjectStore("registros", {keyPath: "id"});
    };
    r.onsuccess = () => { DB = r.result; res(DB); };
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, modo, fn){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(store, modo);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}

    ["d3", "D3 · Sulfato magnesio", 1000, "solucion_madre", "pr-smg"],
    ["d4", "D4 · Microelementos", 1000, "solucion_madre", "pr-edta"],
    ["d5", "D5 · Ácido fosfórico", 1000, "producto_puro", "pr-fos"],
    ["d6", "D6 · Nitrocálcica", 3000, "producto_puro", "pr-cn9"],
    ["d7", "D7 · N-32", 3000, "producto_puro", "pr-n32"]
  ].map(([id_deposito, nombre, capacidad_l, tipo, id_producto]) => ({id_deposito, id_cabezal: cab, nombre, capacidad_l, tipo, activo: true, id_producto}));
  const m = {
    fincas: [{codigo_finca: "MEZ", nombre: "La Mezquita", provincia: "Huelva"}],
    cabezales: [{id_cabezal: cab, codigo_finca: "MEZ", nombre: "General", caudal_maximo_m3_h: 120, activo: true}],
    depositos, valvulas, vparcelas, productos, productosFinca,
    personas: [{id_persona: "p-regador", nombre: "Regador", rol: "regador", codigo_finca: "MEZ", activo: true}],
    parcelas: ["MEZ1", "MEZ2", "MEZ3", "MEZ4", "MEZ5", "MEZ6", "MEZ7", "MEZ8", "MEZ9"], poligonos: []
  };
  m.valvulas.find(v => v.id_valvula === "v-pozo").en_parada = true;

  const h = hoy();
  const dias = [];
  for(let i = 30; i >= 1; i--) dias.push(sumarDias(h, -i));
  const hijas = id => valvulas.filter(v => v.id_valvula_padre === id && v.activo);
  const consumo = {};
  valvulas.filter(v => v.activo && v.tipo === "valvula").forEach(v => {
    consumo[v.id_valvula] = dias.map((d, i) => Math.round(v.caudal_teorico_m3_h * (1.6 + 0.6 * Math.sin(i / 4) + azar() * 0.7)));
  });
  const sinRiegoV3 = sumarDias(h, -6);
  let iSinRiego = dias.indexOf(sinRiegoV3);
  if(diaSemana(sinRiegoV3) === 0) iSinRiego = dias.indexOf(sumarDias(h, -5));
  consumo["v-3"][iSinRiego] = 0;
  const suma = (ids, i) => ids.reduce((a, id) => a + (consumo[id] ? consumo[id][i] : 0), 0);
  consumo["v-g2"] = dias.map((d, i) => Math.round(suma(hijas("v-g2").map(v => v.id_valvula), i) * (1.005 + azar() * 0.015)));
  consumo["v-g1"] = dias.map((d, i) => Math.round((consumo["v-g2"][i] + suma(["v-4", "v-9"], i)) * (1.003 + azar() * 0.01)));
  consumo["v-pozo"] = dias.map((d, i) => Math.round(consumo["v-g1"][i] * (1.008 + azar() * 0.006)));

  let saltoV5 = sumarDias(h, -1);
  if(diaSemana(saltoV5) === 0) saltoV5 = sumarDias(h, -2);
  let atrasadaV7 = sumarDias(h, -4);
  if(diaSemana(atrasadaV7) === 0) atrasadaV7 = sumarDias(h, -3);

  const reg = [];
  Object.keys(consumo).forEach(idV => {
    let acumulado = Math.round(15000 + azar() * 60000);
    let ultima = null;
    dias.forEach((d, i) => {
      acumulado += consumo[idV][i];
      if(diaSemana(d) === 0) return;
      if(idV === "v-5" && d === saltoV5) return;
      if(idV === "v-pozo" && difDias(d, h) <= 12) return;
      const r = {
        id: uuid(), tipo: "lectura", id_valvula: idV, fecha: d,
        lectura_inicial_m3: ultima, lectura_final_m3: acumulado,
        volumen_teorico_m3: consumo[idV] && valvulas.find(v => v.id_valvula === idV).tipo === "valvula" ? Math.round(valvulas.find(v => v.id_valvula === idV).caudal_teorico_m3_h * 2) : null,
        id_persona: "p-regador", obs: [], observaciones: null,
        registrado: new Date(aFecha(d).getTime() + 8.5 * 3600000).toISOString(),
        avisos: [], reinicio: false, revisada_en: null, revisada_por: null,
        estado: "subido", origen: "servidor"
      };
      if(idV === "v-3" && i === iSinRiego){ r.avisos = ["sin_movimiento"]; r.obs = ["No se ha regado"]; r.observaciones = "No se ha regado"; }
      if(idV === "v-7" && d === atrasadaV7){ r.registrado = new Date(aFecha(d).getTime() + 32 * 3600000).toISOString(); }
      reg.push(r);
      ultima = acumulado;
    });
  });

  const plan = {d1: [100, 4], d2: [75, 5], d3: [50, 6], d4: [10, 9], d5: [400, 7], d6: [1500, 10], d7: [1200, 8]};
  depositos.forEach((d, k) => {
    const [cant, cada] = plan[d.id_deposito];
    const pr = productos.find(p => p.id_producto === d.id_producto);
    for(let i = 28 - k; i >= 1; i -= cada){
      let dia = sumarDias(h, -i);
      if(diaSemana(dia) === 0) dia = sumarDias(dia, -1);
      const ts = new Date(aFecha(dia).getTime() + 9 * 3600000).toISOString();
      reg.push({
        id: uuid(), tipo: "carga", id_deposito: d.id_deposito, fecha: ts, volumen_final_l: d.capacidad_l, nivel: 1,
        id_persona: "p-regador", observaciones: null, registrado: ts,
        lineas: [{id_producto: d.id_producto, cantidad: cant, unidad: pr.estado === "solido" ? "kg" : "L"}],
        estado: "subido", origen: "servidor"
      });
    }
  });
  return {m, reg};
}

function convertirPoligonos(filas){
  const out = [];
  (filas || []).forEach(f => {
    try{
      let g = typeof f.geojson === "string" ? JSON.parse(f.geojson) : f.geojson;
      if(g && g.type === "Feature") g = g.geometry;
      if(g && g.type === "FeatureCollection" && g.features && g.features[0]) g = g.features[0].geometry;
      let anillos = [];
      if(g && g.type === "Polygon") anillos = [g.coordinates[0]];
      else if(g && g.type === "MultiPolygon") anillos = g.coordinates.map(p => p[0]);
      anillos.filter(a => Array.isArray(a) && a.length > 2).forEach(a => out.push({codigo_parcela: f.codigo_parcela, anillo: a.map(c => [Number(c[0]), Number(c[1])])}));
    }catch(e){}
  });
  return out;
}

async function fusionarServidor(lecturas, preparaciones, idsV, idsD, desde){
  const locales = new Map(S.reg.map(r => [r.id, r]));
  const fuera = S.reg.filter(r => r.estado === "subido" && (
    (r.tipo === "lectura" && idsV.includes(r.id_valvula) && r.fecha >= desde) ||
    (r.tipo === "carga" && idsD.includes(r.id_deposito) && diaDeTimestamp(r.fecha) >= desde)));
  for(const r of fuera){ await regDel(r.id); }
  const quitar = new Set(fuera.map(r => r.id));
  let nuevos = [];
  lecturas.forEach(l => {
    const loc = locales.get(l.id_lectura);
    if(loc && loc.estado !== "subido") return;
    const obs = (l.observaciones || "").split(";").map(s => s.trim()).filter(Boolean);
    nuevos.push({
      id: l.id_lectura, tipo: "lectura", id_valvula: l.id_valvula, fecha: l.fecha,
      lectura_inicial_m3: l.lectura_inicial_m3 == null ? null : Number(l.lectura_inicial_m3),
      lectura_final_m3: l.lectura_final_m3 == null ? null : Number(l.lectura_final_m3),
      volumen_teorico_m3: l.volumen_teorico_m3 == null ? null : Number(l.volumen_teorico_m3),
      id_persona: l.id_persona, obs, observaciones: l.observaciones, registrado: l.registrado || l.creado,
      avisos: l.avisos || [], reinicio: !!l.reinicio, revisada_en: l.revisada_en || null, revisada_por: l.revisada_por || null,
      estado: "subido", origen: loc ? loc.origen : "servidor"
    });
  });
  preparaciones.forEach(p => {
    const loc = locales.get(p.id_preparacion);
    if(loc && loc.estado !== "subido") return;
    const dep = S.m.depositos.find(d => d.id_deposito === p.id_deposito);
    nuevos.push({
      id: p.id_preparacion, tipo: "carga", id_deposito: p.id_deposito, fecha: p.fecha, volumen_final_l: Number(p.volumen_final_l),
      nivel: dep ? Number(p.volumen_final_l) / Number(dep.capacidad_l) : null,
      id_persona: p.id_persona, observaciones: p.observaciones, registrado: p.registrado || p.creado,
      lineas: (p.preparaciones_lineas || []).map(x => ({id_producto: x.id_producto, cantidad: Number(x.cantidad), unidad: x.unidad})),
      estado: "subido", origen: loc ? loc.origen : "servidor"
    });
  });
  await regPutVarios(nuevos);
  const ids = new Set(nuevos.map(n => n.id));
  S.reg = S.reg.filter(r => !quitar.has(r.id) && !ids.has(r.id)).concat(nuevos);
}

let subiendo = false;
async function subir(silencioso){
  if(subiendo) return;
  const lista = pendientes();
  if(!lista.length){ if(!silencioso) toast("No hay nada pendiente de subir"); return; }
  if(!navigator.onLine){ if(!silencioso) toast("Sin conexión. Se subirá cuando haya red"); return; }
  subiendo = true; pintarPie();
  let ok = 0, fallos = 0, sinRed = false;
  for(const r of lista){
    try{
      if(S.modo === "demo"){
        await esperar(180);
      } else if(r.tipo === "lectura"){
        await sbUpsert("fertirrigacion", "lecturas_contador", [filaLectura(r)], "id_lectura");
      } else {
        await sbUpsert("fertirrigacion", "preparaciones", [filaCarga(r)], "id_preparacion");
        await sbDelete("fertirrigacion", "preparaciones_lineas", "id_preparacion=eq." + r.id);
        await sbInsert("fertirrigacion", "preparaciones_lineas", r.lineas.map(l => ({id_preparacion: r.id, id_producto: l.id_producto, cantidad: l.cantidad, unidad: l.unidad})));
      }
      r.estado = "subido"; r.subido_en = new Date().toISOString(); r.error = null; ok++;
    }catch(e){
      fallos++;
      if(e.sinRed){ sinRed = true; }
      else if(e.status === 409 && r.tipo === "lectura"){ r.estado = "conflicto"; r.error = "Ya hay otra lectura de este contador ese día, apuntada desde otro móvil"; }
      else { r.error = e.message; }
    }
    await regPut(r);
    if(sinRed) break;
  }
  subiendo = false;
  pintarPie();
  if(["inicio", "lista", "tanques"].includes(S.vista)) pintar();
  if(S.vista === "admin") pintarAdmin();
  if(!silencioso || fallos){
    if(sinRed) toast("Se ha cortado la conexión. Lo que falta se subirá después");
    else if(fallos) toast("Subidos " + ok + ". " + fallos + " con problemas: revisa en Administración");
    else toast(ok === 1 ? "Subido 1 registro" : "Subidos " + ok + " registros");
  }
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600);
}

function hoja(opc){
  return new Promise(resolve => {
    const velo = document.createElement("div");
    velo.className = "velo";
    velo.innerHTML = '<div class="hoja" role="dialog" aria-modal="true">' +
      (opc.titulo ? "<h3>" + esc(opc.titulo) + "</h3>" : "") +
      (opc.msg ? '<div class="msg">' + opc.msg + "</div>" : "") +
      (opc.html || "") +
      (opc.opciones || []).map((o, i) => '<button class="opc ' + (o.c || "") + '" data-i="' + i + '">' + esc(o.t) + "</button>").join("") +
      "</div>";
    const cerrar = v => { velo.remove(); resolve(v); };
    velo.addEventListener("click", e => {
      if(e.target === velo) return cerrar(null);
      const b = e.target.closest("button[data-i]");
      if(b){ const o = opc.opciones[Number(b.dataset.i)]; cerrar(opc.alAceptar ? opc.alAceptar(o.v, velo) : o.v); }
    });
    document.body.appendChild(velo);
    const inp = velo.querySelector("input");
    if(inp) setTimeout(() => inp.focus(), 60);
  });
}
async function pedirNumero(titulo, msg, inicial){

    alAceptar: (v, velo) => v === "ok" ? velo.querySelector("#hojaNum").value : null
  });

}

function pintarPie(){
  const pend = pendientes(), conf = conflictos();
  const e = $("#pieEstado"), b = $("#pieBoton");
  if(subiendo){ e.innerHTML = "Subiendo…"; b.disabled = true; return; }
  if(!pend.length && !conf.length){ e.innerHTML = "Todo subido"; b.disabled = true; b.textContent = "Subir"; return; }
  let t = pend.length ? "<b>" + pend.length + "</b> sin subir" : "";
  if(conf.length) t += (t ? ", " : "") + "<b>" + conf.length + "</b> con problema";
  if(!navigator.onLine && pend.length) t += " (se suben al volver la red)";
  e.innerHTML = t;
  b.disabled = !pend.length || !navigator.onLine;
  b.textContent = "Subir";
}

function ir(vista, sinHistorial){

  window.scrollTo(0, 0);
  pintar();

function volver(){

function distanciaM(a, b, c, d){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(c - a), dLon = r(d - b);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function iniciarGPS(){
  if(S.gpsWatch != null || !("geolocation" in navigator)) return;
  try{
    S.gpsWatch = navigator.geolocation.watchPosition(
      p => { S.gps = {lat: p.coords.latitude, lon: p.coords.longitude, prec: p.coords.accuracy}; pintarCerca(); moverYo(); },
      () => {}, {enableHighAccuracy: true, maximumAge: 10000, timeout: 20000});
  }catch(e){}
}
function pararGPS(){ if(S.gpsWatch != null){ try{ navigator.geolocation.clearWatch(S.gpsWatch); }catch(e){} S.gpsWatch = null; } }
function contadorCercano(){
  if(!S.gps) return null;
  const d = valvulasALeer().filter(v => v.latitud != null).map(v => ({v, m: distanciaM(S.gps.lat, S.gps.lon, Number(v.latitud), Number(v.longitud))})).sort((a, b) => a.m - b.m);
  if(!d.length || d[0].m > 40) return null;
  if(d[1] && d[1].m < d[0].m * 1.8) return null;
  return d[0];
}
function pintarCerca(){

  S.m.poligonos.forEach(p => {

    L.polygon(ll, {color: "#FFE500", weight: 2, fillOpacity: 0.06, interactive: false}).addTo(m)
      .bindTooltip(p.codigo_parcela.replace(S.fincaCod || "", ""), {permanent: true, direction: "center", className: "etq-mapa"});

  S.mapa = m; marcaYo = null; moverYo();
}
function moverYo(){
  if(!S.mapa || !S.gps || typeof L === "undefined") return;
  const ll = [S.gps.lat, S.gps.lon];

  else marcaYo.setLatLng(ll);
}
function abrirLectura(idV, desdeAdmin, fecha){

function prepararEdicion(idV, admin){

    texto: ex && ex.lectura_final_m3 != null ? String(ex.lectura_final_m3).replace(".", ",") : "",
    obs: ex ? [...(ex.obs || [])] : [], reinicio: ex ? !!ex.reinicio : false, inicial: ex && ex.reinicio ? ex.lectura_inicial_m3 : null,
    programado: ex && ex.volumen_teorico_m3 != null ? ex.volumen_teorico_m3 : ultimoProgramado(idV, S.fecha),
    tocado: false, reemplazar: !!(ex && ex.lectura_final_m3 != null)

}
function valorEd(){ const t = S.ed.texto; if(t === "" || t === ",") return null; const n = Number(t.replace(",", ".")); return isNaN(n) ? null : n; }
function soloLectura(){
  const ex = S.ed.existente;
  if(S.ed.admin || S.admin) return false;
  if(!ex || ex.estado !== "subido") return false;
  return difDias(ex.fecha, hoy()) > DIAS_CORRECCION;
}

function cuentakm(texto, opc){
  opc = opc || {};
  const t = texto || "";
  const [ent, dec] = t.split(",");
  const entero = (ent || "").replace(/^0+(?=\d)/, "");
  const celdas = Math.max(opc.min || 6, entero.length);
  let html = '<div class="cuentakm' + (opc.chico ? " chico" : "") + '" aria-label="' + esc(t || "0") + ' metros cúbicos">';
  for(let i = 0; i < celdas; i++){
    const pos = i - (celdas - entero.length);
    html += pos >= 0 ? '<span class="r">' + entero[pos] + "</span>" : '<span class="r vacia">0</span>';
  }
  if(dec !== undefined){
    html += '<span class="coma">,</span>';
    const nd = Math.max(1, dec.length);
    for(let i = 0; i < nd; i++) html += dec[i] !== undefined ? '<span class="r dec">' + dec[i] + "</span>" : '<span class="r dec vacia" style="opacity:.5">0</span>';
  }
  if(opc.cursor) html += '<span class="cursor"></span>';
  return html + "</div>";
}
function textoNumero(n){
  if(n == null) return "";
  const s = String(Number(n));
  return s.replace(".", ",");
}

  html += '<div class="ultima"><div class="et">Última lectura<b>' + (prev ? esc(etiquetaDiaLarga(prev.fecha)) : "No hay") + "</b></div>" + (prev ? cuentakm(textoNumero(prev.lectura_final_m3), {chico: true, min: 5}) : "") + "</div>";

  if(!ro){
    html += '<div class="obs">' + OBSERVACIONES.map(o => '<button class="' + (ed.obs.includes(o) ? "on" : "") + '" onclick="alternarObs(\'' + o + '\')">' + esc(o) + "</button>").join("") + "</div>";
    html += '<div class="teclado">' + ["1", "2", "3", "4", "5", "6", "7", "8", "9", ",", "0", "⌫"].map(k => '<button class="' + (k === "," || k === "⌫" ? "fn" : "") + '" onclick="tecla(\'' + k + '\')" aria-label="' + (k === "⌫" ? "Borrar" : k) + '">' + k + "</button>").join("") + "</div>";
    html += '<button class="btn-guardar" id="btnGuardar" onclick="guardarLectura()">Guardar</button>';
    if(ed.reinicio) html += '<button class="btn-sec" onclick="quitarReinicio()">No es un contador nuevo</button>';
  } else {
    html += '<div class="solo-lectura">Si ves un error, avisa al técnico.</div>';

function tecla(k){
  const ed = S.ed; let t = ed.texto;
  if(ed.reemplazar && k !== "⌫"){ t = ""; }
  ed.reemplazar = false;
  if(k === "⌫") t = t.slice(0, -1);
  else if(k === ","){ if(!t.includes(",")) t = (t || "0") + ","; }
  else {
    const [e, d] = t.split(",");
    if(d !== undefined){ if(d.length < 2) t += k; }
    else if((e || "").replace(/^0+/, "").length < 9) t = (t === "0" ? "" : t) + k;
  }
  ed.texto = t; ed.tocado = true;
  pintarLecturaDinamica();
}
function alternarObs(o){
  const ed = S.ed;
  ed.obs = ed.obs.includes(o) ? ed.obs.filter(x => x !== o) : ed.obs.concat(o);
  pintarLectura();
}
function quitarReinicio(){ S.ed.reinicio = false; S.ed.inicial = null; pintarLectura(); }

function mensajeAviso(a, ev){
  const prevTxt = ev.prev ? fmtAuto(ev.prev.lectura_final_m3) + " m³, " + etiquetaDiaLarga(ev.prev.fecha) : "";
  switch(a){
    case "menor_que_anterior": return {c: "rojo", t: "Es menos que la última lectura (" + prevTxt + "). ¿La has leído bien?"};
    case "mayor_que_posterior": return {c: "rojo", t: "Es más que la lectura de " + etiquetaDiaLarga(ev.next.fecha) + " (" + fmtAuto(ev.next.lectura_final_m3) + " m³)."};
    case "exceso": return {c: "ambar", t: "Es mucho más de lo normal" + (ev.media ? ": suele gastar unos " + fmt(ev.media) + " m³ al día." : ".")};
    case "sin_movimiento": return {c: "ambar", t: "El contador no se ha movido. ¿No se ha regado?"};
    case "movimiento_en_parada": return {c: "ambar", t: "Está en parada y el contador se ha movido (" + fmt(ev.m3) + " m³). ¿Se está regando o hay una fuga?"};
  }
  return {c: "ambar", t: AVISOS_TXT[a] || a};
}
function pintarLecturaDinamica(){
  const ed = S.ed, v = valvula(ed.idV);
  const valor = valorEd();
  const ro = soloLectura();
  $("#km").innerHTML = cuentakm(ed.texto, {cursor: !ro, min: 6});
  const ev = evaluar(v, ed.fecha, valor, {reinicio: ed.reinicio, inicial: ed.inicial});
  let res = "";
  if(valor == null){
    res = ed.obs.includes("No puedo leerlo") ? "Se guardará sin número" : (ev.prev ? '<small>Escribe el número que marca el contador</small>' : "");
  } else if(ed.reinicio){
    res = fmt(ev.m3) + " m³ <small>desde que se puso el contador nuevo (empezó en " + fmtAuto(ed.inicial) + ")</small>";

    res = "<small>Primera lectura de este contador</small>";
  } else if(ev.dias <= 1){
    res = (ev.m3 < 0 ? "−" + fmt(-ev.m3) : fmt(ev.m3)) + " m³ <small>desde " + etiquetaDiaLarga(ev.prev.fecha) + "</small>";
  } else {
    res = (ev.m3 < 0 ? "−" + fmt(-ev.m3) : fmt(ev.m3)) + " m³ en " + ev.dias + " días <small>" + (ev.m3 >= 0 ? fmt(ev.m3 / ev.dias) + " m³ al día, " : "") + "desde " + etiquetaDiaLarga(ev.prev.fecha) + "</small>";
  }
  $("#res").innerHTML = res;
  pintarProgramado(ev, valor);
  let avs = "";
  const ignorarParado = ed.obs.includes("No se ha regado");
  ev.avisos.filter(a => !(a === "sin_movimiento" && ignorarParado)).forEach(a => { const m = mensajeAviso(a, ev); avs += '<div class="caja-aviso ' + m.c + '">' + esc(m.t) + "</div>"; });
  if(ed.reinicio) avs += '<div class="caja-aviso info">Marcado como contador nuevo o que ha dado la vuelta.</div>';
  $("#avs").innerHTML = avs;
  pintarBarras(v, ed.fecha, valor, ev);
  const b = $("#btnGuardar");
  if(b) b.disabled = valor == null && !ed.obs.includes("No puedo leerlo");
}
function diasDeRiego(desde, hasta){
  let n = 0;
  for(let d = sumarDias(desde, 1); d <= hasta; d = sumarDias(d, 1)) if(diaSemana(d) !== 0) n++;
  return Math.max(1, n);
}
function pintarProgramado(ev, valor){
  const el = $("#prog"); if(!el) return;
  const ed = S.ed, ro = soloLectura();
  const p = ed.programado;
  let html = '<div class="programado"><span>Programado<br><b>' + (p != null ? fmtAuto(p) + " m³" : "sin poner") + "</b></span>" + (ro ? "" : '<button onclick="cambiarProgramado()">' + (p != null ? "Cambiar" : "Poner") + "</button>") + "</div>";
  if(p != null && valor != null && ev.m3 != null && ev.m3 >= 0 && !ed.reinicio && ev.prev){
    const dr = diasDeRiego(ev.prev.fecha, ed.fecha);
    const objetivo = p * dr;
    const d = ev.m3 - objetivo;
    const pct = objetivo > 0 ? Math.round(d / objetivo * 100) : null;
    const nota = dr > 1 ? " (" + dr + " días de riego: " + fmt(objetivo) + " m³ programados)" : "";
    if(Math.abs(d) < 0.5) html += '<div class="dif-prog igual">Igual que lo programado' + nota + "</div>";
    else html += '<div class="dif-prog ' + (d > 0 ? "mas" : "menos") + '">' + fmt(Math.abs(d)) + " m³ " + (d > 0 ? "más" : "menos") + " que lo programado" + (pct != null ? " (" + (d > 0 ? "+" : "−") + Math.abs(pct) + " %)" : "") + nota + "</div>";
  }

async function guardarLectura(){
  const ed = S.ed, v = valvula(ed.idV);
  const valor = valorEd();
  const noLegible = ed.obs.includes("No puedo leerlo");
  if(valor == null && !noLegible){ toast("Escribe la lectura o marca «No puedo leerlo»"); return; }
  let avisos = [], reinicio = ed.reinicio, inicial = ed.inicial;
  if(valor != null && !reinicio){
    const ev = evaluar(v, ed.fecha, valor);
    if(ev.avisos.includes("menor_que_anterior")){
      const r = await hoja({
        titulo: "¿Seguro?",
        msg: esc(mensajeAviso("menor_que_anterior", ev).t),
        opciones: [{t: "Corregir", v: "corregir", c: "gris"}, {t: "La anterior estaba mal", v: "anterior"}, {t: "Han cambiado el contador o ha dado la vuelta", v: "reinicio"}]
      });
      if(!r || r === "corregir") return;
      if(r === "reinicio"){
        const ok = await hoja({
          titulo: "¿Contador nuevo?",
          msg: "Solo si han puesto un contador nuevo o el número ha vuelto a empezar. Se avisará al técnico.",
          opciones: [{t: "Sí, es un contador nuevo", v: "si", c: "ok"}, {t: "No, volver", v: null, c: "gris"}]
        });
        if(ok !== "si") return;
        const arr = await pedirNumero("¿Por qué número empezó?", "El número que marcaba el contador nuevo al ponerlo. Si no lo sabes, deja 0.", "0");
        if(arr == null) return;
        if(arr > valor){ await hoja({titulo: "No cuadra", msg: "El número de arranque (" + fmtAuto(arr) + ") es mayor que la lectura de hoy.", opciones: [{t: "Volver", v: null, c: "gris"}]}); return; }
        reinicio = true; inicial = arr;
      } else {
        avisos.push("menor_que_anterior", "anterior_erronea");
      }
      const resto = ev.avisos.filter(a => a === "mayor_que_posterior");
      avisos.push(...resto);
    } else {
      const lista = ev.avisos.filter(a => !(a === "sin_movimiento" && ed.obs.includes("No se ha regado")));
      if(lista.length){
        const r = await hoja({
          titulo: "¿Seguro?",
          msg: lista.map(a => "<p style='margin:0 0 8px'>" + esc(mensajeAviso(a, ev).t) + "</p>").join(""),
          opciones: [{t: "Sí, está bien", v: "ok", c: "ok"}, {t: "Corregir", v: null, c: "gris"}]
        });
        if(r !== "ok") return;
      }
      avisos.push(...ev.avisos);
    }
  }
  const ex = lecturaDelDia(ed.idV, ed.fecha);
  const prev = anterior(ed.idV, ed.fecha);
  const rec = Object.assign({}, ex || {}, {
    id: ex ? ex.id : uuid(), tipo: "lectura", id_valvula: ed.idV, fecha: ed.fecha,
    lectura_inicial_m3: reinicio ? inicial : (prev ? prev.lectura_final_m3 : null),
    lectura_final_m3: valor, volumen_teorico_m3: ed.programado == null ? null : ed.programado, id_persona: S.personaId,
    obs: [...ed.obs], observaciones: ed.obs.length ? ed.obs.join("; ") : null,
    registrado: ex && ex.registrado ? ex.registrado : new Date().toISOString(),
    avisos: [...new Set(avisos)], reinicio: !!reinicio,
    revisada_en: null, revisada_por: null,
    estado: "pendiente", origen: ex ? ex.origen : "movil", error: null
  });
  await regPut(rec);
  S.reg = S.reg.filter(r => r.id !== rec.id).concat(rec);
  toast(rec.avisos.length || rec.reinicio ? "Guardada (con aviso para el técnico)" : "Guardada");
  if(navigator.onLine) subir(true);
  if(ed.admin){ volver(); return; }
  const act = valvulasALeer();
  const i = act.findIndex(x => x.id_valvula === ed.idV);
  const sig = act.slice(i + 1).concat(act.slice(0, i)).find(x => !lecturaDelDia(x.id_valvula, ed.fecha));
  if(sig){ prepararEdicion(sig.id_valvula, false); window.scrollTo(0, 0); pintar(); }
  else { toast("Todos los contadores apuntados"); volver(); }
}

function lineaNueva(idP, cantidad){
  const sacos = usaSacos(idP);
  const l = {id_producto: idP, modo: sacos ? "sacos" : "teclado", sacos: 0, texto: ""};
  if(cantidad != null){
    const pf = productoFinca(idP);
    if(sacos && Number.isInteger(cantidad / pf.envase_kg)) l.sacos = cantidad / pf.envase_kg;
    else { l.modo = "teclado"; l.texto = textoNumero(cantidad); }
  }
  return l;
}
function abrirTanque(idD, idCarga){
  const d = deposito(idD);
  const ex = idCarga ? S.reg.find(r => r.id === idCarga) : null;
  const lineas = ex ? ex.lineas.map(l => lineaNueva(l.id_producto, l.cantidad)) : [lineaNueva(d.id_producto)];
  S.edT = {idD, existente: ex, lineas, activa: 0, litros: ex ? ex.volumen_final_l : Number(d.capacidad_l), litrosTexto: null};
  ir("tanque");
}
function cantidadLinea(l){
  if(!l.id_producto) return null;
  if(l.modo === "sacos"){ const pf = productoFinca(l.id_producto); return pf && pf.envase_kg ? l.sacos * Number(pf.envase_kg) : null; }
  if(l.texto === "" || l.texto === ",") return null;
  const n = Number(l.texto.replace(",", ".")); return isNaN(n) ? null : n;
}
function soloLecturaCarga(){
  const ex = S.edT.existente;
  if(S.admin || !ex || ex.estado !== "subido") return false;
  return difDias(diaDeTimestamp(ex.fecha), hoy()) > DIAS_CORRECCION;
}
function opcionesLitros(cap){
  const paso = cap > 3000 ? 1000 : 500;
  const ops = [];
  for(let v = paso; v < cap; v += paso) ops.push(v);
  ops.push(cap);
  return ops;
}

      (ro ? "" : '<div class="acc"><button onclick="event.stopPropagation();cambiarProducto(' + i + ')">Cambiar</button>' + (e.lineas.length > 1 ? '<button class="quitar" onclick="event.stopPropagation();quitarLinea(' + i + ')">Quitar</button>' : "") + "</div>") + "</div>";

      html += '<div class="kg-equiv">' + fmtAuto(l.sacos * pf.envase_kg) + ' kg</div><div style="text-align:center"><button class="enlace" onclick="modoCantidad(\'teclado\')">Poner los kg a mano</button></div>';

      if(usaSacos(l.id_producto)) html += '<div style="text-align:center"><button class="enlace" onclick="modoCantidad(\'sacos\')">Contar sacos</button></div>';

      '<button class="' + (!enOps ? "on" : "") + '" onclick="otrosLitros()">' + (!enOps && e.litros ? fmt(e.litros) : "Otro") + "<small>" + (!enOps && e.litros ? "litros" : "escribir") + "</small></button></div>";
    html += '<button class="btn-guardar" onclick="guardarCarga()">Guardar carga</button>';

  if(hist.length){

function lineaActiva(){ return S.edT.lineas[S.edT.activa]; }
function activarLinea(i){ S.edT.activa = i; pintarTanque(); }
function sacos(n){ const l = lineaActiva(); l.sacos = Math.max(0, l.sacos + n); pintarTanque(); }
function modoCantidad(m){
  const l = lineaActiva(), pf = productoFinca(l.id_producto);
  if(m === "teclado" && l.sacos && pf) l.texto = textoNumero(l.sacos * pf.envase_kg);
  if(m === "sacos") l.sacos = 0;
  l.modo = m; pintarTanque();
}
function litrosT(v){ S.edT.litros = v; pintarTanque(); }
async function otrosLitros(){
  const d = deposito(S.edT.idD);
  const v = await pedirNumero("¿Hasta cuántos litros?", "Litros que hay en el tanque después de llenarlo (capacidad " + fmt(d.capacidad_l) + " L).", "");
  if(v == null || v <= 0) return;
  S.edT.litros = Math.round(v); pintarTanque();
}
function teclaT(k){
  const l = lineaActiva(); let t = l.texto;
  if(k === "⌫") t = t.slice(0, -1);
  else if(k === ","){ if(!t.includes(",")) t = (t || "0") + ","; }
  else { const [a, b] = t.split(","); if(b !== undefined){ if(b.length < 2) t += k; } else if((a || "").length < 6) t = (t === "0" ? "" : t) + k; }
  l.texto = t; pintarTanque();
}
async function elegirProducto(titulo, actualId){
  const lista = productosHabituales();
  const actual = producto(actualId);
  if(actual && !lista.includes(actual)) lista.unshift(actual);
  if(!lista.length){ toast("No hay productos habituales en esta finca. Se añaden en Administración."); return null; }
  return hoja({titulo, opciones: lista.map(p => ({t: p.nombre, v: p.id_producto, c: p.id_producto === actualId ? "ok" : "gris"})).concat([{t: "Volver", v: null, c: "gris"}])});
}
async function cambiarProducto(i){
  const l = S.edT.lineas[i];
  const v = await elegirProducto("¿Qué producto has echado?", l.id_producto);
  if(!v) return;
  S.edT.lineas[i] = lineaNueva(v); S.edT.activa = i;

async function anadirLinea(){
  const v = await elegirProducto("¿Qué otro producto has echado?", null);
  if(!v) return;
  if(S.edT.lineas.some(l => l.id_producto === v)){ toast("Ese producto ya está en la carga"); return; }
  S.edT.lineas.push(lineaNueva(v)); S.edT.activa = S.edT.lineas.length - 1;
  pintarTanque();
}
async function quitarLinea(i){
  S.edT.lineas.splice(i, 1);
  S.edT.activa = Math.min(S.edT.activa, S.edT.lineas.length - 1);
  pintarTanque();
}
async function guardarCarga(){
  const e = S.edT, d = deposito(e.idD);
  const lineas = [];
  for(const l of e.lineas){
    const pr = producto(l.id_producto);
    if(!pr){ toast("Elige el producto"); return; }
    const cant = cantidadLinea(l);
    if(!cant || cant <= 0){ toast("Falta la cantidad de " + pr.nombre); S.edT.activa = e.lineas.indexOf(l); pintarTanque(); return; }
    lineas.push({id_producto: pr.id_producto, cantidad: cant, unidad: unidadProducto(pr)});
  }
  if(!lineas.length){ toast("Añade al menos un producto"); return; }
  if(!e.litros || e.litros <= 0){ toast("Marca hasta cuántos litros lo has llenado"); return; }
  const avisos = [];
  if(e.litros > Number(d.capacidad_l)) avisos.push("Has puesto " + fmt(e.litros) + " L y en el tanque caben " + fmt(d.capacidad_l) + " L.");
  lineas.filter(l => l.unidad === "L" && l.cantidad > Number(d.capacidad_l)).forEach(l => avisos.push("Son más litros de " + producto(l.id_producto).nombre + " (" + fmt(l.cantidad) + " L) de los que caben en el tanque."));
  if(avisos.length){
    const r = await hoja({titulo: "¿Seguro?", msg: avisos.map(a => "<p style='margin:0 0 8px'>" + esc(a) + "</p>").join(""), opciones: [{t: "Sí, está bien", v: "ok", c: "ok"}, {t: "Corregir", v: null, c: "gris"}]});
    if(r !== "ok") return;
  }
  const ex = e.existente;
  let fecha;
  if(ex) fecha = ex.fecha;
  else if(S.fecha === hoy()) fecha = new Date().toISOString();
  else fecha = new Date(aFecha(S.fecha).getTime() + 12 * 3600000).toISOString();
  const rec = Object.assign({}, ex || {}, {
    id: ex ? ex.id : uuid(), tipo: "carga", id_deposito: e.idD, fecha,
    volumen_final_l: Math.round(e.litros), nivel: e.litros / Number(d.capacidad_l), id_persona: S.personaId,
    observaciones: ex ? ex.observaciones : null, registrado: ex && ex.registrado ? ex.registrado : new Date().toISOString(),
    lineas, estado: "pendiente", origen: ex ? ex.origen : "movil", error: null
  });
  await regPut(rec);
  S.reg = S.reg.filter(r => r.id !== rec.id).concat(rec);
  toast("Carga guardada: " + lineas.map(l => fmtAuto(l.cantidad) + " " + l.unidad + " de " + producto(l.id_producto).nombre).join(", "));
  if(navigator.onLine) subir(true);
  volver();
}

function numCampo(id, opc){
  const t = ($("#" + id).value || "").trim();
  if(t === "") return opc && opc.vacio !== undefined ? opc.vacio : null;
  const n = Number(t.replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? NaN : n;
}
async function guardarConfig(tabla, filtro, cambios, aplicar, silencioso){
  if(S.modo === "campo"){
    if(!navigator.onLine){ toast("Necesitas conexión para cambiar la configuración"); return false; }
    try{ await sbPatch("fertirrigacion", tabla, filtro, cambios); }
    catch(e){ await hoja({titulo: "No se pudo guardar", msg: esc(e.message), opciones: [{t: "Entendido", v: null, c: "gris"}]}); return false; }
  }
  aplicar();
  if(!silencioso){ await guardarMaestros(); toast("Cambios guardados"); pintarAdmin(); }
  return true;
}
async function guardarCabezal(){
  const c = S.m.cabezales.find(x => x.id_cabezal === S.cabezalId);
  const q = numCampo("cab_caudal");
  if(isNaN(q) || (q != null && q <= 0)){ toast("Revisa el caudal"); return; }
  await guardarConfig("cabezales", "id_cabezal=eq." + c.id_cabezal, {caudal_maximo_m3_h: q}, () => { c.caudal_maximo_m3_h = q; });
}
async function guardarValvula(id){
  const v = valvula(id);
  const estado = $("#va_" + id).value;
  const cambios = {
    nombre: $("#vn_" + id).value.trim() || v.nombre,
    orden: numCampo("vo_" + id, {vacio: 0}),
    caudal_teorico_m3_h: numCampo("vc_" + id),
    activo: estado !== "baja",
    en_parada: estado === "parada",
    id_valvula_padre: $("#vp_" + id).value || null
  };
  if(isNaN(cambios.orden) || !Number.isInteger(cambios.orden)){ toast("El orden tiene que ser un número entero"); return; }
  if(isNaN(cambios.caudal_teorico_m3_h) || (cambios.caudal_teorico_m3_h != null && cambios.caudal_teorico_m3_h < 0)){ toast("Revisa el caudal"); return; }
  let parcelas = null;
  if($("#vpn_" + id)){
    parcelas = [];
    const n = Number($("#vpn_" + id).value);
    for(let k = 0; k < n; k++){
      const c = $("#vpp_" + id + "_" + k).value; if(!c) continue;
      const f = numCampo("vpf_" + id + "_" + k, {vacio: 1});
      if(isNaN(f) || f <= 0 || f > 1){ toast("La fracción va de 0 a 1 (1 si riega la parcela entera)"); return; }
      if(parcelas.some(p => p.codigo_parcela === c)){ toast("La parcela " + c + " está repetida"); return; }
      parcelas.push({id_valvula: id, codigo_parcela: c, fraccion: f});
    }
  }
  const okV = await guardarConfig("valvulas", "id_valvula=eq." + id, cambios, () => Object.assign(v, cambios), true);
  if(!okV) return;
  if(parcelas){
    const antes = S.m.vparcelas.filter(x => x.id_valvula === id).map(x => x.codigo_parcela + ":" + Number(x.fraccion)).sort().join("|");
    const despues = parcelas.map(x => x.codigo_parcela + ":" + x.fraccion).sort().join("|");
    if(antes !== despues){
      if(S.modo === "campo"){
        try{
          await sbDelete("fertirrigacion", "valvulas_parcelas", "id_valvula=eq." + id);
          if(parcelas.length) await sbInsert("fertirrigacion", "valvulas_parcelas", parcelas);
        }catch(e){ await hoja({titulo: "No se pudieron guardar las parcelas", msg: esc(e.message), opciones: [{t: "Entendido", v: null, c: "gris"}]}); return; }
      }
      S.m.vparcelas = S.m.vparcelas.filter(x => x.id_valvula !== id).concat(parcelas);
    }
  }
  await guardarMaestros(); toast("Cambios guardados"); pintarAdmin();
}
async function pararTodos(parar){
  const ok = await hoja({titulo: parar ? "Poner todos en parada" : "Quitar la parada a todos", msg: parar ? "Los contadores dejan de pedirse cada día hasta que se quite la parada." : "Todos los contadores activos vuelven a pedirse cada día.", opciones: [{t: parar ? "Poner en parada" : "Quitar la parada", v: "ok", c: "ok"}, {t: "Volver", v: null, c: "gris"}]});
  if(ok !== "ok") return;
  await guardarConfig("valvulas", "id_cabezal=eq." + S.cabezalId + "&activo=eq.true", {en_parada: parar}, () => valvulasActivas().forEach(v => { v.en_parada = parar; }));
}
function codigoNuevo(nombre){
  const base = ((S.fincaCod || "X") + "-" + nombre).toUpperCase().replace(/\s+/g, "_");
  let c = base, n = 2;
  while(S.m.valvulas.some(v => v.codigo_contador === c)) c = base + "_" + n++;
  return c;
}
async function altaValvula(){
  const nombre = $("#nv_nombre").value.trim();
  if(!nombre){ toast("Pon el nombre del contador"); return; }
  const caudal = numCampo("nv_caudal"), orden = numCampo("nv_orden", {vacio: 0});
  if(isNaN(caudal) || isNaN(orden)){ toast("Revisa los números"); return; }
  const fila = {id_valvula: uuid(), id_cabezal: S.cabezalId, codigo_contador: codigoNuevo(nombre), nombre, tipo: $("#nv_tipo").value, caudal_teorico_m3_h: caudal, activo: true, en_parada: false, id_valvula_padre: $("#nv_padre").value || null, orden: Math.round(orden)};
  const parcela = $("#nv_parcela").value;
  const vp = parcela ? [{id_valvula: fila.id_valvula, codigo_parcela: parcela, fraccion: 1}] : [];
  if(S.modo === "campo"){
    if(!navigator.onLine){ toast("Necesitas conexión para cambiar la configuración"); return; }
    try{ await sbInsert("fertirrigacion", "valvulas", [fila]); if(vp.length) await sbInsert("fertirrigacion", "valvulas_parcelas", vp); }
    catch(e){ await hoja({titulo: "No se pudo dar de alta", msg: esc(e.message), opciones: [{t: "Entendido", v: null, c: "gris"}]}); return; }

const TESELA_URL = (z, x, y) => "https://www.ign.es/wmts/pnoa-ma?request=GetTile&service=WMTS&version=1.0.0&Format=image/jpeg&layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&TileMatrix=" + z + "&TileRow=" + y + "&TileCol=" + x;
let DBT = null;
function idbTeselas(){
  if(DBT) return Promise.resolve(DBT);
  return new Promise((res, rej) => {
    const r = indexedDB.open("regadores-teselas", 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("t")) r.result.createObjectStore("t"); };
    r.onsuccess = () => { DBT = r.result; res(DBT); };
    r.onerror = () => rej(r.error);
  });
}
async function txT(modo, fn){
  const db = await idbTeselas();
  return new Promise((res, rej) => {
    const t = db.transaction("t", modo); const req = fn(t.objectStore("t"));
    t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const teselaGet = k => txT("readonly", st => st.get(k));
const teselaPut = (k, b) => txT("readwrite", st => st.put(b, k));
const teselasContar = () => txT("readonly", st => st.count());
const teselasVaciar = () => txT("readwrite", st => st.clear());

function capaTeselas(){
  const capa = L.tileLayer(TESELA_URL("{z}", "{x}", "{y}"), {maxZoom: 19, attribution: "IGN España, PNOA"});
  capa.createTile = function(c, hecho){
    const img = document.createElement("img"); img.alt = ""; img.setAttribute("role", "presentation");
    const red = () => { img.onload = () => hecho(null, img); img.onerror = e => hecho(e, img); img.src = TESELA_URL(c.z, c.x, c.y); };
    teselaGet(c.z + "_" + c.x + "_" + c.y).then(b => {
      if(b){ img.onload = () => hecho(null, img); img.onerror = red; img.src = URL.createObjectURL(b); } else red();
    }).catch(red);
    return img;
  };
  return capa;
}
function lonLatATesela(lon, lat, z){
  const n = Math.pow(2, z), r = lat * Math.PI / 180;
  return {x: Math.floor((lon + 180) / 360 * n), y: Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)};
}
function teselasNecesarias(zMin, zMax){
  const pts = [];
  S.m.poligonos.forEach(p => p.anillo.forEach(c => pts.push(c)));
  valvulasActivas().filter(v => v.latitud != null).forEach(v => pts.push([Number(v.longitud), Number(v.latitud)]));
  if(!pts.length) return [];
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
  const m = 0.002;
  const oeste = Math.min(...lons) - m, este = Math.max(...lons) + m, sur = Math.min(...lats) - m, norte = Math.max(...lats) + m;
  const lista = [];
  for(let z = zMin; z <= zMax; z++){
    const a = lonLatATesela(oeste, norte, z), b = lonLatATesela(este, sur, z);
    for(let x = a.x; x <= b.x; x++) for(let y = a.y; y <= b.y; y++) lista.push({z, x, y});
  }
  return lista;
}
async function guardarMapaSinRed(){
  const lista = teselasNecesarias(13, 18);
  if(!lista.length){ toast("Primero descarga los datos de la finca (polígonos o contadores situados)"); return; }
  if(!navigator.onLine){ toast("Necesitas conexión"); return; }
  const ok = await hoja({titulo: "Guardar el mapa sin conexión", msg: "Se descargan " + lista.length + " imágenes de satélite (unos " + fmt(lista.length * 35 / 1024, 1) + " MB). Mejor con wifi.", opciones: [{t: "Descargar", v: "ok", c: "ok"}, {t: "Volver", v: null, c: "gris"}]});
  if(ok !== "ok") return;
  let hechas = 0, fallos = 0, i = 0;
  const trabajador = async () => {
    while(i < lista.length){
      const t = lista[i++]; const k = t.z + "_" + t.x + "_" + t.y;
      try{
        if(!(await teselaGet(k))){
          const r = await fetch(TESELA_URL(t.z, t.x, t.y));
          if(!r.ok) throw new Error(r.status);
          await teselaPut(k, await r.blob());
        }
        hechas++;
      }catch(e){ fallos++; }
      if((hechas + fallos) % 20 === 0) toast("Mapa: " + (hechas + fallos) + " de " + lista.length);
    }
  };
  await Promise.all([trabajador(), trabajador(), trabajador(), trabajador()]);
  toast(fallos ? "Mapa guardado con " + fallos + " imágenes que no bajaron" : "Mapa guardado para usar sin conexión");
  pintarAdmin();
}

      S.fincaCod = est.fincaCod; S.cabezalId = est.cabezalId; S.personaId = est.personaId;
      const m = await kvGet("maestros"); if(m) S.m = Object.assign(S.m, m);
      S.descarga = (await kvGet("descarga")) || null;
      S.reg = (await regTodos()) || [];
    } else {
      await regVaciar(); S.reg = []; S.m = maestrosVacios(); S.descarga = null;
      if(MODO_INICIAL === "demo") await cargarDemo();
      else { await guardarMaestros(); await guardarEstado(); }
    }
    await purgarAntiguos();
  }catch(e){
    console.error(e);
    $("#app").innerHTML = '<div class="bloque"><h3>No se puede guardar en este navegador</h3><p>' + esc(e.message || e) + "</p></div>";
    return;
  }
  S.fecha = hoy();
  history.replaceState({v: "inicio"}, "");
  pintar();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if(navigator.onLine) setTimeout(() => subir(true), 1500);
}
window.addEventListener("online", () => { pintarCabecera(); pintarPie(); if(S.vista === "inicio") pintar(); subir(true); });
window.addEventListener("offline", () => { pintarCabecera(); pintarPie(); if(S.vista === "inicio") pintar(); });
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && S.fecha !== hoy() && S.vista === "inicio"){ S.fecha = hoy(); pintar(); }
});

if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const nuevo = reg.installing; if(!nuevo) return;
        nuevo.addEventListener("statechange", () => {
          if(nuevo.state === "installed" && navigator.serviceWorker.controller) toast("Hay una versión nueva: se usará al volver a abrir la app");
          if(nuevo.state === "activated" && !navigator.serviceWorker.controller) toast("App lista para trabajar sin conexión");
        });
      });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
  });
}
arrancar();
</script>
</body>
